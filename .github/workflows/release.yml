name: Release to h3yyy.m3s.app
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write # GitHub OIDC identity for secretless Tailscale access

concurrency:
  group: h3yyy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Do not let prereleases or drafts replace production.
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    environment: p
    steps:
      - name: Verify the Tailscale OIDC trust is configured
        env:
          CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
        run: |
          test -n "$CLIENT_ID" && test -n "$AUDIENCE" || {
            echo 'Set TS_OIDC_CLIENT_ID and TS_OIDC_AUDIENCE in the p environment' >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          build-args: |
            RELEASE_TAG=${{ github.event.release.tag_name }}
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:github-actions
      - name: Deploy the immutable digest through Komodo
        env:
          KOMODO_URL: http://100.105.6.60:9120
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/deploy.py
